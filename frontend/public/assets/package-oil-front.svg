  <!-- Bottle Cap -->
  <rect x="175" y="10" width="50" height="25" rx="3" fill="#dc2626"/>
  
  <!-- Transparent Glass Highlight -->
  <path d="M170 30 L230 30 L230 70 L260 130 L260 620 C260 645 240 665 210 665 L190 665 C160 665 140 645 140 620 L140 130 L170 70 Z" fill="url(#bottleGrad)"/>

