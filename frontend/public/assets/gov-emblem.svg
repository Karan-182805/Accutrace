<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!-- Stylized National Emblem Motif for Regulatory Header -->
  <g fill="#102a45">
    <circle cx="50" cy="22" r="14" fill="none" stroke="#102a45" stroke-width="2.5"/>
    <path d="M42 22 Q50 14 58 22 Q50 30 42 22 Z" fill="#102a45"/>
    <circle cx="50" cy="22" r="3" fill="#102a45"/>
    <!-- Central Lion Head silhouette -->
    <path d="M44 36 L56 36 L54 50 L46 50 Z" />
    <path d="M38 40 Q50 34 62 40 L60 52 Q50 48 40 52 Z" />
    <circle cx="45" cy="42" r="1.5" fill="#ffffff"/>
    <circle cx="55" cy="42" r="1.5" fill="#ffffff"/>
    <!-- Left Lion silhouette -->
    <path d="M32 43 Q38 38 42 45 L38 54 Q33 50 32 43 Z"/>
    <!-- Right Lion silhouette -->
    <path d="M68 43 Q62 38 58 45 L62 54 Q67 50 68 43 Z"/>
    <!-- Capital Base -->
    <rect x="25" y="58" width="50" height="7" rx="1.5"/>
    <!-- Ashoka Chakra on abacus -->
    <circle cx="50" cy="73" r="7" fill="none" stroke="#102a45" stroke-width="1.8"/>
    <line x1="50" y1="66" x2="50" y2="80" stroke="#102a45" stroke-width="1"/>
    <line x1="43" y1="73" x2="57" y2="73" stroke="#102a45" stroke-width="1"/>
    <line x1="45" y1="68" x2="55" y2="78" stroke="#102a45" stroke-width="1"/>
    <line x1="45" y1="78" x2="55" y2="68" stroke="#102a45" stroke-width="1"/>
    <!-- Bull on right, Horse on left silhouettes -->
    <path d="M32 75 Q36 71 40 75 L38 78 Q34 77 32 75 Z"/>
    <path d="M68 75 Q64 71 60 75 L62 78 Q66 77 68 75 Z"/>
    <!-- Plinth Base -->
    <rect x="20" y="83" width="60" height="6" rx="1"/>
    <rect x="15" y="91" width="70" height="5" rx="1"/>
    <!-- Motto "Satyameva Jayate" in Devanagari representation -->
    <text x="50" y="108" font-family="'Noto Sans Devanagari', 'Mangal', sans-serif" font-size="7" font-weight="bold" text-anchor="middle" letter-spacing="0.5">सत्यमेव जयते</text>
  </g>
</svg>
